<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dictaphone FR — page de test</title>
<style>
  :root { color-scheme: dark; }
  body { font: 15px/1.5 "Segoe UI", system-ui, sans-serif; background:#101216; color:#e7e9ee;
         max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color:#8b93a3; margin-bottom: 24px; font-size: 13px; }
  .bar { display:flex; gap:12px; align-items:center; margin-bottom:18px; flex-wrap: wrap; }
  button { font: inherit; padding: 10px 18px; border-radius: 10px; border:1px solid #333a48;
           background:#1b2029; color:#e7e9ee; cursor:pointer; }
  button:hover { background:#232a35; }
  button.rec { background:#c0392b; border-color:#e05a4a; }
  .dot { width:11px; height:11px; border-radius:50%; background:#4a5162; transition:background .2s; }
  .dot.on { background:#e74c3c; box-shadow:0 0 0 4px rgba(231,76,60,.18); }
  .meter { flex:1; min-width:180px; height:8px; border-radius:6px; background:#1b2029; overflow:hidden; }
  .meter > i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#2ecc71,#f1c40f,#e74c3c); }
  #live { min-height:22px; color:#8b93a3; font-style: italic; margin: 14px 0; }
  #out { white-space: pre-wrap; background:#161a21; border:1px solid #262d3a; border-radius:12px;
         padding:16px; min-height:180px; }
  .stats { color:#6f7787; font-size:12px; margin-top:14px; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <h1>Dictaphone FR — page de test</h1>
  <div class="sub">Sert à vérifier le micro et la transcription avant d'installer l'extension. Le texte apparaît en direct, puis se fige à chaque pause.</div>

  <div class="bar">
    <span class="dot" id="dot"></span>
    <button id="btn">Démarrer la dictée</button>
    <button id="clr">Effacer</button>
    <div class="meter"><i id="lvl"></i></div>
  </div>

  <div id="live"></div>
  <div id="out"></div>
  <div class="stats" id="stats">…</div>

<script>
const SR = 16000;
let ws = null, ctx = null, stream = null, node = null, src = null, media = null;
let running = false;

const $ = (id) => document.getElementById(id);
const out = $("out"), live = $("live"), dot = $("dot"), lvl = $("lvl"), stats = $("stats");

async function refreshStats() {
  try {
    const r = await fetch("/health").then(r => r.json());
    stats.textContent = `modèle=${r.model}  device=${r.device}  précision=${r.compute_type}  `
      + `gpu=${r.gpu}  dernières_inférence=${r.last_infer_ms} ms pour ${r.last_audio_s} s  appels=${r.total_calls}`;
  } catch { stats.textContent = "serveur injoignable"; }
}
setInterval(refreshStats, 1500); refreshStats();

$("clr").onclick = () => { out.textContent = ""; live.textContent = ""; };

function toast(msg) { live.textContent = msg; }

$("btn").onclick = () => running ? stop() : start();

async function start() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  } catch (e) { toast("Micro refusé : " + e.message); return; }

  ctx = new AudioContext({ sampleRate: SR });
  await ctx.audioWorklet.addModule("worklet.js");
  src = ctx.createMediaStreamSource(stream);
  node = new AudioWorkletNode(ctx, "pcm-worklet");
  const sink = ctx.createGain(); sink.gain.value = 0;
  src.connect(node); node.connect(sink); sink.connect(ctx.destination);

  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => ws.send(JSON.stringify({ type: "start", language: "fr" }));
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "partial") live.textContent = "… " + m.text;
    else if (m.type === "final") {
      out.textContent += (out.textContent && !/\s$/.test(out.textContent) ? " " : "") + m.text;
      live.textContent = "";
    } else if (m.type === "ready") toast(`moteur prêt (${m.model} / ${m.device})`);
    else if (m.type === "error") toast("erreur : " + m.message);
  };
  ws.onerror = () => toast("WebSocket en erreur");

  node.port.onmessage = (ev) => {
    if (ws && ws.readyState === 1) ws.send(ev.data);
    const pcm = new Int16Array(ev.data);
    let s = 0; for (let i = 0; i < pcm.length; i += 4) s += (pcm[i] / 32768) ** 2;
    lvl.style.width = Math.min(100, Math.sqrt(s / (pcm.length / 4)) * 320).toFixed(0) + "%";
  };

  running = true; dot.classList.add("on"); $("btn").textContent = "Arrêter la dictée";
  $("btn").classList.add("rec"); toast("écoute…");
}

async function stop() {
  running = false; dot.classList.remove("on"); lvl.style.width = "0%";
  $("btn").textContent = "Démarrer la dictée"; $("btn").classList.remove("rec");
  if (ws && ws.readyState === 1) { ws.send(JSON.stringify({ type: "stop" })); setTimeout(() => ws.close(), 1500); }
  node && node.port.close();
  src && src.disconnect(); stream && stream.getTracks().forEach(t => t.stop());
  ctx && ctx.close(); toast("");
}
</script>
</body>
</html>
